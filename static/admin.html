<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROUTE / Orders</title><link rel="stylesheet" href="style.css"><main style="max-width:1000px;margin:50px auto"><a class="logo" href="/">ROUTE®</a><h1 style="font-size:48px;margin-top:40px">Order requests</h1><p>Use an SSH tunnel for secure admin access. Token is kept only in this page’s memory.</p><form id="login"><input id="token" type="password" required placeholder="Admin token" autocomplete="off"><button class="primary">Load orders</button></form><p id="message"></p><div id="orders"></div></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+document.querySelector('#token').value}});if(!r.ok){document.querySelector('#message').textContent='Authentication failed';return}document.querySelector('#token').value='';document.querySelector('#orders').replaceChildren();for(const o of await r.json()){let article=document.createElement('article');let pre=document.createElement('pre');pre.style='white-space:pre-wrap;border-bottom:1px solid #ddd;padding:25px 0';pre.textContent=o.id+' · '+o.created+' · '+o.status+'\n'+JSON.stringify(JSON.parse(o.data),null,2);article.append(pre);document.querySelector('#orders').append(article)}};</script></html>
